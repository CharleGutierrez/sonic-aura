[package]
name = "sonic_aura"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.17"
crossterm = "0.29.0"
hound = "3.5.1"
libc = "0.2"
num-complex = "0.4.6"
ratatui = "0.30.2"
realfft = "3.5.0"
ringbuf = "0.5.1"
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
nnnoiseless = "0.5.1"
rustfft = "6.2.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
# 
rubato = "0.15"
ebur128 = "0.1"
ctrlc = "3.4"
